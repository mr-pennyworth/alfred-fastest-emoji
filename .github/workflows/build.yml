name: Build and Release

on: push

permissions:
  contents: read

jobs:
  check-release:
    name: Check Release Requirement
    runs-on: macos-latest
    outputs:
      wf_version: ${{ steps.wf.outputs.wf_version }}
      needs_release: ${{ steps.check.outputs.needs_release }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get Workflow Version
        id: wf
        run: |
          WF_VERSION="$(plutil -extract version raw -o - info.plist)"
          echo "wf_version=${WF_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if this version already has a release
        id: check
        uses: actions/github-script@v7
        env:
          WF_VERSION: ${{ steps.wf.outputs.wf_version }}
        with:
          script: |
            try {
              await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: process.env.WF_VERSION,
              });
              core.setOutput('needs_release', 'false');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.setOutput('needs_release', 'true');
            }

  build-and-release:
    name: Build and Release FAMOS
    needs: check-release
    if: github.ref == 'refs/heads/main' && needs.check-release.outputs.needs_release == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    concurrency:
      group: famos-release
      cancel-in-progress: false
    env:
      WF_VERSION: ${{ needs.check-release.outputs.wf_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set Up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: build-scripts/package-lock.json

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Build Dependencies
        run: npm ci --prefix build-scripts --ignore-scripts

      - name: Generate Mapping from Emoji to Icon Filename
        run: python3 build-scripts/make_emoji_to_icon_filename_mapping.py

      - name: Make Apple Icons
        run: node build-scripts/make_apple_icons.js

      - name: Make Workflows
        run: python3 build-scripts/mkworkflows.py

      - name: Create Release and Upload Workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$WF_VERSION" wfbuild/*.alfredworkflow \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$WF_VERSION" --generate-notes
